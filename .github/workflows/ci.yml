name: frontend-ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  # PR 피드백은 최신 실행만 남기되, dev publish는 commit별로 순차 완료한다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: frontend-ci / check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install CI contract dependencies
        run: python3 -m pip install --require-hashes -r .github/requirements-ci.txt

      - name: Test frontend CI contract
        run: python3 -m unittest -v tests.test_frontend_ci_contract

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate dev public build variables
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_KAKAO_REST_KEY: ${{ vars.VITE_KAKAO_REST_KEY }}
          VITE_KAKAO_JS_KEY: ${{ vars.VITE_KAKAO_JS_KEY }}
        run: |
          set -euo pipefail
          : "${VITE_API_BASE_URL:?VITE_API_BASE_URL GitHub Actions Variable must be configured}"
          : "${VITE_KAKAO_REST_KEY:?VITE_KAKAO_REST_KEY GitHub Actions Variable must be configured}"
          : "${VITE_KAKAO_JS_KEY:?VITE_KAKAO_JS_KEY GitHub Actions Variable must be configured}"

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ github.event_name == 'pull_request' && '/api/core/v1' || vars.VITE_API_BASE_URL }}
          VITE_KAKAO_REST_KEY: ${{ github.event_name == 'pull_request' && 'ci-public-rest-key' || vars.VITE_KAKAO_REST_KEY }}
          VITE_KAKAO_JS_KEY: ${{ github.event_name == 'pull_request' && 'ci-public-js-key' || vars.VITE_KAKAO_JS_KEY }}
        run: |
          set -euo pipefail
          : "${VITE_API_BASE_URL:?VITE_API_BASE_URL must be a non-empty build-time value}"
          : "${VITE_KAKAO_REST_KEY:?VITE_KAKAO_REST_KEY must be a non-empty build-time value}"
          : "${VITE_KAKAO_JS_KEY:?VITE_KAKAO_JS_KEY must be a non-empty build-time value}"
          npm run build

      - name: Assert API base URL in dist
        env:
          VITE_API_BASE_URL: ${{ github.event_name == 'pull_request' && '/api/core/v1' || vars.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          : "${VITE_API_BASE_URL:?VITE_API_BASE_URL must be a non-empty build-time value}"
          if ! grep --recursive --fixed-strings --quiet -- "$VITE_API_BASE_URL" dist; then
            echo "::error::Built dist does not contain the configured VITE_API_BASE_URL"
            exit 1
          fi

      - name: Test frontend
        run: npm run test

      - name: Create immutable frontend image recipe
        run: |
          set -euo pipefail
          mkdir -p .ci-image/context
          cp -R dist .ci-image/context/dist
          cp infra/frontend-image/Dockerfile .ci-image/context/Dockerfile
          cp infra/frontend-image/nginx.conf .ci-image/context/nginx.conf

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Validate frontend container image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .ci-image/context
          file: .ci-image/context/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: pinlog-front:ci-${{ github.sha }}

      - name: Smoke test frontend container security contract
        run: |
          set -euo pipefail
          image="pinlog-front:ci-${GITHUB_SHA}"
          cid=$(docker run --detach \
            --user 101:101 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --publish 127.0.0.1::8080 \
            "$image")
          cleanup() {
            docker logs "$cid" || true
            docker rm --force "$cid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          address=$(docker port "$cid" 8080/tcp)
          base_url="http://${address}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$base_url/healthz" > /tmp/healthz; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::Frontend container did not become healthy"
              exit 1
            fi
            sleep 1
          done

          test "$(cat /tmp/healthz)" = "ok"
          curl --fail --silent --show-error "$base_url/" > /tmp/root.html
          curl --fail --silent --show-error "$base_url/spa-route" > /tmp/spa.html
          cmp /tmp/root.html /tmp/spa.html
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "$base_url/api/core/v1/healthz")" = "404"

      - name: Upload validated frontend image context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-image-${{ github.sha }}
          path: .ci-image/context/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  image-publish:
    name: frontend-image / publish
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download validated frontend image context
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-image-${{ github.sha }}
          path: .ci-image/context

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite existing commit tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

          registry_token=$(curl --fail --silent --show-error \
            --user "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode 'scope=repository:team-pinlog/front:pull,push' \
            'https://ghcr.io/token' | jq -er '.token')

          set +e
          http_status=$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --head \
            --header "Authorization: Bearer ${registry_token}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/team-pinlog/front/manifests/${GITHUB_SHA}")
          curl_status=$?
          set -e

          if [ "$curl_status" -ne 0 ]; then
            echo "::error::Registry preflight request failed"
            exit 1
          fi
          case "$http_status" in
            404)
              echo "Commit tag is available"
              ;;
            200)
              echo "::error::Commit tag already exists; refusing to overwrite"
              exit 1
              ;;
            *)
              echo "::error::Registry preflight returned unexpected HTTP ${http_status}"
              exit 1
              ;;
          esac

      - name: Build and publish immutable frontend image
        id: publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .ci-image/context
          file: .ci-image/context/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/team-pinlog/front:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify published image digest
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          inspection=$(docker buildx imagetools inspect "ghcr.io/team-pinlog/front:${GITHUB_SHA}")
          RESOLVED_DIGEST=$(printf '%s\n' "$inspection" \
            | sed -nE 's/^Digest:[[:space:]]+(sha256:[0-9a-f]{64})$/\1/p' \
            | head -n 1)
          [[ "$RESOLVED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$RESOLVED_DIGEST" = "$IMAGE_DIGEST"
          docker buildx imagetools inspect "ghcr.io/team-pinlog/front@${IMAGE_DIGEST}"
          echo "Published digest: $IMAGE_DIGEST"
