apiVersion: pinlog.io/v1alpha1
kind: RuntimeConfigContract
metadata:
  name: front-dev
spec:
  service: front
  environment: dev
  source:
    repository: Team-PinLog/front
    baseRef: refs/heads/dev
  # Vite embeds every VITE_* value in the browser bundle. These are public build
  # configuration sourced from GitHub Actions Variables, never Kubernetes Secrets.
  publicVariables:
    - VITE_API_BASE_URL
    - VITE_KAKAO_REST_KEY
    - VITE_KAKAO_JS_KEY
  ownerSecretKeys: []
  infraOwnedKeys: []
  target:
    namespace: pinlog-dev
    name: front-runtime-config
  rollout:
    mode: image-rebuild
